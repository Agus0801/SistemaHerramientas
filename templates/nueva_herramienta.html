{% extends "base.html" %}

{% block contenido %}

<h2>Nueva Herramienta</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Nombre</label>

<input class="form-control" name="nombre" required>

</div>

<div class="col-md-6 mb-3">

<label>Marca</label>

<input class="form-control" name="marca" required>

</div>

<div class="col-md-6 mb-3">

<label>Modelo</label>

<input class="form-control" name="modelo">

</div>

<div class="col-12 mb-3">

<label>Observaciones</label>

<textarea class="form-control" name="observaciones"></textarea>

</div>

</div>

<button class="btn btn-success">

Guardar

</button>

<a href="/herramientas" class="btn btn-secondary">

Cancelar

</a>

</form>

{% endblock %}
