{% extends "base.html" %}

{% block contenido %}

<h2>Editar Herramienta</h2>

<form method="POST">

<div class="mb-3">

<label>Nombre</label>

<input
class="form-control"
name="nombre"
value="{{ herramienta.nombre }}"
required>

</div>

<div class="mb-3">

<label>Marca</label>

<input
class="form-control"
name="marca"
value="{{ herramienta.marca }}"
required>

</div>

<div class="mb-3">

<label>Modelo</label>

<input
class="form-control"
name="modelo"
value="{{ herramienta.modelo }}">

</div>

<div class="mb-3">

<label>Observaciones</label>

<textarea
class="form-control"
name="observaciones">{{ herramienta.observaciones }}</textarea>

</div>

<button class="btn btn-success">

Guardar cambios

</button>

<a href="/herramientas"
class="btn btn-secondary">

Cancelar

</a>

</form>

{% endblock %}
